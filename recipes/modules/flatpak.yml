---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

- type: default-flatpaks
  configurations:
    - scope: user
      repo:
        # you can override the title to make inclusion of both system and user repos clearer
        title: Flathub (user)
    - notify: true
      scope: system
      repo:
        title: Flathub (system)
      install: # system flatpaks we want all users to have and not remove
        - com.bitwarden.desktop
        - com.collaboraoffice.Office
        - com.discordapp.Discord
        - com.github.tchx84.Flatseal
        - com.mikrotik.WinBox
        - com.valvesoftware.Steam
        - com.vysp3r.ProtonPlus
        - com.xnview.XnConvert
        - io.github.diegopvlk.Cine
        - io.github.Faugus.faugus-launcher
        - io.github.flattool.Warehouse
        - io.missioncenter.MissionCenter
        - org.cockpit_project.CockpitClient
        - org.fedoraproject.MediaWriter
        - org.mozilla.firefox
        - org.mozilla.thunderbird
        - com.brave.Browser
