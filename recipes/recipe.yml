---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: fedora-bluebuild
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
#base-image: ghcr.io/ublue-os/silverblue-main
#base-image: ghcr.io/ublue-os/kinoite-main
# base-image: quay.io/fedora/fedora-kinoite
# base-image: quay.io/fedora-ostree-desktops/kinoite
# base-image: quay.io/fedora/fedora-bootc
base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 45 # You can pin to a specific version of Fedora as well
platforms:
  - linux/amd64

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: modules/dnf.yml
  - from-file: modules/files.yml
  - from-file: modules/systemd.yml
  - from-file: modules/signing.yml
